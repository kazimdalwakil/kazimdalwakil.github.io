    - title: MSc in Computer Science - Enterprise Software Systems (Level 9)
      institution: South East Technological University, Waterford, Ireland
      year: Sept 2025 – Sept 2026
      description:
        - "Ranked among the top two students in the MSc cohort (current standing, August 2026)."
        - "Expected Award: First Class Honours."
        - title: Thesis
          contents:
            - "<b>Title</b>: DeepUS-ReconSeg++: Multi-Angle Ultrasound Reconstruction and Segmentation<br>
                A deep learning pipeline integrating deformable image registration, transformer-based cross-angle fusion, 
                and dual-task learning for simultaneous ultrasound reconstruction and segmentation. 
                Achieved PSNR of 40.5966 dB, SSIM of 0.9592, Dice of 0.9273, and IoU of 0.8652 on a held-out test set."

    - title: Bachelor of Science in Computer Science
      institution: BRAC University, Dhaka, Bangladesh
      year: May 2019 - Sept 2023
      description:
        - "<b>CGPA: </b> 3.98 out of 4.00"
        - "Top 3 in class"
        - "Graduated with Highest Distinction"
        - "VC's List - 7 Semesters"
        - title: Thesis
          contents:
            - "<b>Title</b>: Recommendation System for Mood Stabilization using Content Recommendation<br>
                The main motive of this thesis is to create a system where emotions can be detected by processing brain activity (EEG signals). 
                Make the best use of data we already have in order to create a prototype which can be used later on in a large scale. 
                We will try to analyze which algorithm will work best, whether it's a traditional model or deep learning model.
                Later on, we implemented a recommendation system based on the fusion of two prevalent techniques, creating a hybrid recommendation system. 
                Furthermore, concepts of Analytic Hierarchy Process (AHP) have been implemented to come up 
                with an efficient algorithm which works in stabilizing an individual's mood gradually."

